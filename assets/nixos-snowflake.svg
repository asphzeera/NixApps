<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="nixLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EBAE4"/>
      <stop offset="100%" stop-color="#5277C3"/>
    </linearGradient>
    <linearGradient id="nixDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5277C3"/>
      <stop offset="100%" stop-color="#3B5BA5"/>
    </linearGradient>
  </defs>
  <!-- Stylized 6-arm NixOS lambda snowflake -->
  <g transform="translate(64,64)">
    <!-- 3 light-blue arms (0°, 120°, 240°) -->
    <g fill="url(#nixLight)">
      <g transform="rotate(0)">
        <path d="M -8 -44 L 8 -44 L 22 -20 L 14 -6 L 0 -30 L -14 -6 L -22 -20 Z"/>
        <rect x="-6" y="-54" width="12" height="22" rx="4"/>
      </g>
      <g transform="rotate(120)">
        <path d="M -8 -44 L 8 -44 L 22 -20 L 14 -6 L 0 -30 L -14 -6 L -22 -20 Z"/>
        <rect x="-6" y="-54" width="12" height="22" rx="4"/>
      </g>
      <g transform="rotate(240)">
        <path d="M -8 -44 L 8 -44 L 22 -20 L 14 -6 L 0 -30 L -14 -6 L -22 -20 Z"/>
        <rect x="-6" y="-54" width="12" height="22" rx="4"/>
      </g>
    </g>
    <!-- 3 deep-blue arms (60°, 180°, 300°) -->
    <g fill="url(#nixDark)">
      <g transform="rotate(60)">
        <path d="M -8 -44 L 8 -44 L 22 -20 L 14 -6 L 0 -30 L -14 -6 L -22 -20 Z"/>
        <rect x="-6" y="-54" width="12" height="22" rx="4"/>
      </g>
      <g transform="rotate(180)">
        <path d="M -8 -44 L 8 -44 L 22 -20 L 14 -6 L 0 -30 L -14 -6 L -22 -20 Z"/>
        <rect x="-6" y="-54" width="12" height="22" rx="4"/>
      </g>
      <g transform="rotate(300)">
        <path d="M -8 -44 L 8 -44 L 22 -20 L 14 -6 L 0 -30 L -14 -6 L -22 -20 Z"/>
        <rect x="-6" y="-54" width="12" height="22" rx="4"/>
      </g>
    </g>
    <!-- Clean hexagonal center -->
    <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#FFFFFF" fill-opacity="0.92"/>
  </g>
</svg>
