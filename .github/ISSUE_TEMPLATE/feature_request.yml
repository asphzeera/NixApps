name: Feature Request
description: Suggest a new feature or enhancement for NixApps
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this feature solve in your NixOS workflow?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working in NixApps.
    validations:
      required: true
  - type: checkboxes
    id: alignment
    attributes:
      label: Declarative Safety Alignment
      options:
        - label: This feature respects the managed `.nix` module model (ADR-0001)
