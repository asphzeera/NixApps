name: Bug Report
description: Report a bug or unexpected behavior in NixApps
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open NixApps
        2. Search for '...'
        3. Click '...'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: NixOS version, Flakes/Home Manager setup, Wayland compositor/DE
      placeholder: |
        - NixOS channel: e.g., nixos-26.05 / unstable
        - Target mode: Home Manager / NixOS System
        - Compositor/DE: e.g., Niri / GNOME / Hyprland
    validations:
      required: true
