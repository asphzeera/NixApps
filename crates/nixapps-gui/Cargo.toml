[package]
name = "nixapps-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native GTK4 + Libadwaita (Relm4) graphical interface for NixApps"

[[bin]]
name = "nixapps"
path = "src/main.rs"

[dependencies]
nixapps-core = { path = "../nixapps-core" }
relm4 = { version = "0.11", features = ["libadwaita", "gnome_48"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
